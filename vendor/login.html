<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vendor Login</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header>

    <nav>

        <div class="logo">
            Street Vendor Management System
        </div>

        <ul class="nav-links">

            <li>
                <a href="../index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="../directory/vendors.html">
                    Vendor Directory
                </a>
            </li>

            <li>
                <a href="register.html">
                    Register
                </a>
            </li>

            <li>
                <a href="login.html">
                    Vendor Login
                </a>
            </li>

            <li>
                <a href="../admin/login.html">
                    Admin Login
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>

    <section class="login-section">

        <div class="login-container">

            <h1>Vendor Login</h1>

            <p>
                Login to view your vendor profile and status.
            </p>


            <form id="vendorLoginForm">

                <div class="form-group">

                    <label for="vendorIdLogin">
                        Vendor ID
                    </label>

                    <input
                        type="text"
                        id="vendorIdLogin"
                        placeholder="Example: VND-1234"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="vendorMobileLogin">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="vendorMobileLogin"
                        placeholder="Enter registered mobile number"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn submit-btn"
                >
                    Login
                </button>


                <p
                    id="vendorLoginError"
                    class="login-error"
                ></p>

            </form>

        </div>

    </section>

</main>


<footer>

    <p>
        © 2026 Street Vendor Management System
    </p>

</footer>


<script src="../js/vendor.js"></script>

</body>

</html>
