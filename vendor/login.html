<!-- ===============================
     VENDOR LOGIN
================================ -->

<main>

    <section class="form-section vendor-login-section">

        <div class="form-container vendor-login-container">

            <h2>
                Vendor Login
            </h2>

            <p>
                Login using your Vendor ID and
                registered mobile number.
            </p>


            <!-- ===============================
                 LOGIN FORM
            ================================ -->

            <form id="vendorLoginForm">


                <!-- Vendor ID -->

                <label for="vendorIdLogin">
                    Vendor ID
                </label>

                <input
                    type="text"
                    id="vendorIdLogin"
                    placeholder="Example: VND-1234"
                    required
                >


                <!-- Password -->

                <label for="vendorPasswordLogin">
                    Password
                </label>

                <input
                    type="password"
                    id="vendorPasswordLogin"
                    placeholder="Enter your password"
                    required
                >


                <!-- Login Button -->

                <button type="submit">
                    Login as Vendor
                </button>


                <!-- Login Error -->

                <p
                    id="vendorLoginError"
                    style="color: red;"
                ></p>


            </form>


            <!-- ===============================
                 REGISTER LINK
            ================================ -->

            <p style="margin-top: 20px;">

                Don't have a vendor account?

                <a href="register.html">
                    Register as Vendor
                </a>

            </p>


        </div>

    </section>

</main>
