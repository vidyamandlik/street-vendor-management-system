<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vendor Directory</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header>

    <nav>

        <div class="logo">

            <a href="../index.html">

                <img src="../img/logo.png"
                     alt="Street Vendor Management System">

            </a>

        </div>

        <ul class="nav-links">

            <li>
                <a href="../index.html">
                    Home
                </a>
            </li>

            <li id="customerVendorDirectory"
                style="display: none;">

                <a href="vendors.html">
                    Vendor Directory
                </a>

            </li>

            <li>
                <a href="../vendor/register.html">
                    Register
                </a>
            </li>

            <li>
                <a href="../vendor/login.html">
                    Vendor Login
                </a>
            </li>

            <li>
                <a href="../admin/login.html">
                    Admin Login
                </a>
            </li>

        </ul>

    </nav>

</header>


<main id="mainContent"
      class="vendor-profile-page">

    <!-- Vendor Directory / Vendor Profile
         will be loaded using vendor.js -->

</main>


<!-- =====================================================
     RATING & REVIEW MODAL
===================================================== -->

<div id="reviewModal"
     class="review-modal">

    <div class="review-modal-content">

        <button type="button"
                id="closeReviewModal"
                class="close-review-modal"
                aria-label="Close">

            &times;

        </button>

        <h2>
            Rate & Review Vendor
        </h2>

        <p id="reviewVendorName"></p>

        <form id="reviewForm">

            <input
                type="hidden"
                id="reviewVendorId"
            >

            <label>
                Rating
            </label>

            <div class="star-rating">

                <button
                    type="button"
                    class="rating-star"
                    data-rating="1">

                    ★

                </button>

                <button
                    type="button"
                    class="rating-star"
                    data-rating="2">

                    ★

                </button>

                <button
                    type="button"
                    class="rating-star"
                    data-rating="3">

                    ★

                </button>

                <button
                    type="button"
                    class="rating-star"
                    data-rating="4">

                    ★

                </button>

                <button
                    type="button"
                    class="rating-star"
                    data-rating="5">

                    ★

                </button>

            </div>

            <p id="selectedRating">
                Select your rating
            </p>

            <label for="reviewText">
                Your Review
            </label>

            <textarea
                id="reviewText"
                placeholder="Write your review..."
                rows="5"
                required></textarea>

            <button
                type="submit"
                class="submit-review-btn">

                Submit Review

            </button>

        </form>

        <p id="reviewMessage"></p>

    </div>

</div>


<footer>

    <p>
        © 2026 Street Vendor Management System
    </p>

</footer>


<script src="../js/vendor.js"></script>

</body>

</html>
