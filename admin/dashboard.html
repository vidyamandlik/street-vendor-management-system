<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<header>

    <nav>

            <div class="logo">
    <a href="../index.html">
        <img src="../img/logo.png" alt="Street Vendor Management System">
    </a>
</div>


        <ul class="nav-links">

            <li>
                <a href="../index.html">
                    Main Website
                </a>
            </li>

            <li>
                <a href="#"
                   onclick="logout()">
                    Logout
                </a>
            </li>

        </ul>

    </nav>

</header>


<main class="admin-dashboard">


    <h1>Vendor Management Dashboard</h1>

    <p class="dashboard-subtitle">
        Manage and verify registered street vendors.
    </p>


    <!-- Statistics -->

    <section class="stats-container">


        <div class="stat-card">

            <h3>Total Vendors</h3>

            <p id="totalVendors">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Pending</h3>

            <p id="pendingVendors">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Verified</h3>

            <p id="verifiedVendors">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Rejected</h3>

            <p id="rejectedVendors">
                0
            </p>

        </div>


    </section>


    <!-- Vendor Applications -->

    <section class="vendor-management">

        <div class="section-header">
            <h2>Vendor Applications</h2>
            <button id="refreshVendorsBtn" class="refresh-btn" type="button" title="Refresh Vendor List">
                ↻ Refresh
            </button>
        </div>

        <!-- Notification Banner -->
        <div id="adminNotification" class="admin-notification" style="display: none;"></div>

        <!-- Filters & Search Toolbar -->
        <div class="admin-toolbar">
            <div class="search-wrapper">
                <input
                    type="text"
                    id="adminVendorSearch"
                    placeholder="Search by ID, Name, Business, Category, District..."
                    class="admin-search-input"
                >
            </div>
            <div class="filter-wrapper">
                <label for="adminStatusFilter">Status:</label>
                <select id="adminStatusFilter" class="admin-filter-select">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Verified">Verified</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Vendor ID</th>

                        <th>Name</th>

                        <th>Business</th>

                        <th>Category</th>

                        <th>District</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="vendorTableBody">

                </tbody>

            </table>

        </div>
<div id="adminPagination" class="admin-pagination" style="margin-top:15px; text-align:center;">
    <button id="prevPageBtn" class="btn" disabled>Previous</button>
    <span id="pageInfo" style="margin:0 10px;">Page 1 of 1</span>
    <button id="nextPageBtn" class="btn">Next</button>
</div>

    </section>


</main>


<footer>

    <p>
        © 2026 Street Vendor Management System
    </p>

</footer>


<script src="../js/admin.js"></script>

</body>

</html>
