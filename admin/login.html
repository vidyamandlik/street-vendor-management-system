          href="../css/style.css">

</head>

<body>


<!-- ===============================

================================ -->

<header>

    <nav>

           <div class="logo">
    <a href="../index.html">
        <img src="../img/logo.png" alt="Street Vendor Management System">
    </a>
</div>



        <ul class="nav-links">

            <li>

        </ul>

    </nav>

</header>


<!-- ===============================
     ADMIN LOGIN
================================ -->

<main>

    <section class="form-section admin-login-section">

        <div class="form-container admin-login-container">

            <h2>
                Admin Login
            </h2>

            <p>
                Login to manage and verify street vendors.
            </p>


            <!-- ===============================
                 LOGIN FORM
            ================================ -->

            <form id="adminLoginForm">


                <!-- Admin Username -->

                <label for="adminUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Enter admin username"
                    required
                >


                <!-- Admin Password -->

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >


                <!-- Login Button -->

                <button type="submit">
                    Login as Admin
                </button>


                <!-- Login Message -->

                <p id="adminLoginMessage"></p>

            </form>


            <p style="margin-top: 20px;">

                <a href="../index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </section>

</main>
